name: 'Genropy Docker Build and Push'
description: 'Build and push Docker images of a Genropy project'
author: 'genropy'

inputs:
  image_name:
    description: 'Name of the Docker image'
    required: true
  instance_name:
    description: 'Instance name for genropy'
    required: true
  registry:
    description: 'Container registry URL'
    required: false
    default: 'hub.genro.com'
  push_registry:
    description: 'Registry endpoint used for login/push (e.g. in-cluster service). Defaults to the in-cluster Forgejo service; pass an empty string to fall back to `registry`. Image is still referenced as `registry` for deployers.'
    required: false
    default: 'forgejo.forgejo.svc.cluster.local:3000'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  genropy_branch:
    description: 'Branch (or tag/commit) of the genropy repository to install'
    required: false
    default: 'master'
  subfolder:
    description: "Repository subfolder for projects"
    required: false
    default: ''
  github_clone_token:
    description: 'Token for cloning private repositories from github.com'
    required: false
    default: ''
  genro_clone_token:
    description: 'Token for cloning private repositories from hub.genro.com'
    required: false
    default: ''
  registry_token:
    description: 'GitHub token for registry authentication'
    required: true
  deployer_urls:
    description: 'Comma-separated URLs to notify after build (GENROPY_DEPLOYER_URLS)'
    required: false
    default: ''
  deployer_token:
    description: 'Token for deployer authentication (GENROPY_DEPLOYER_TOKEN)'
    required: false
    default: ''
  image_tag:
    description: 'Override the computed image tag (takes precedence over branch-based tag logic)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install genropy
      shell: bash
      env:
        BUILD_SUBFOLDER: ${{ inputs.subfolder }}
        GENROPY_BRANCH: ${{ inputs.genropy_branch }}

      run: |
        pip install "git+https://github.com/genropy/genropy.git@${GENROPY_BRANCH:-master}#subdirectory=gnrpy"
        gnr app initgenropy --skip-existing
        gnr core bagedit $HOME/.gnr/environment.xml add projects.build path=$(dirname "$GITHUB_WORKSPACE")$BUILD_SUBFOLDER
        
    - name: Resolve push registry
      shell: bash
      run: |
        PUSH_REGISTRY="${{ inputs.push_registry }}"
        [[ -z "$PUSH_REGISTRY" ]] && PUSH_REGISTRY="${{ inputs.registry }}"
        echo "PUSH_REGISTRY=$PUSH_REGISTRY" >> "$GITHUB_ENV"
        
    - name: Log in to Container Registry
      shell: bash
      run: |
        echo "${{ inputs.registry_token }}" | docker login "$PUSH_REGISTRY" \
        -u "${{ github.actor }}" --password-stdin
        
    - name: Compute image tag
      shell: bash
      run: |
        if [[ -n "${{ inputs.image_tag }}" ]]; then
          TAG="${{ inputs.image_tag }}"
        else
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" || "$BRANCH" == "develop" ]]; then
            TAG="latest"
          else
            TAG="${BRANCH//\//-}"
          fi
        fi
        echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

    - name: Configure git auth header and run builder
      id: dockerize
      shell: bash
      env:
        GITHUB_CLONE_TOKEN: ${{ inputs.github_clone_token }}
        GENRO_CLONE_TOKEN: ${{ inputs.genro_clone_token }}
      run: |
        set -euo pipefail
        export GNR_LOGLEVEL=debug
        export GIT_TERMINAL_PROMPT=0
        export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig_with_pat"

        cat > "$GIT_CONFIG_GLOBAL" <<'EOF'
        [url "https://github.com/"]
          insteadOf = git@github.com:
          insteadOf = ssh://git@github.com/
        [url "https://hub.genro.com/"]
          insteadOf = git@hub.genro.com:
          insteadOf = ssh://git@hub.genro.com/
        EOF
        if [ -n "${GITHUB_CLONE_TOKEN:-}" ]; then
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global http.https://github.com/.extraheader \
          "AUTHORIZATION: basic $(printf "x-access-token:%s" "$GITHUB_CLONE_TOKEN" | base64 -w0)"
        fi
        if [ -n "${GENRO_CLONE_TOKEN:-}" ]; then
          git config --global --unset-all http.https://hub.genro.com/.extraheader || true
          git config --global http.https://hub.genro.com/.extraheader \
          "AUTHORIZATION: basic $(printf "%s:" "$GENRO_CLONE_TOKEN" | base64 -w0)"
        fi
        gnr app dockerize --bleeding -p -r "$PUSH_REGISTRY" -n ${{ inputs.image_name }} -u ${{ github.repository_owner}} -t $IMAGE_TAG ${{ inputs.instance_name }}

    - name: Notify Genropy deployers
      if: ${{ success() && steps.dockerize.outcome == 'success' }}
      shell: bash
      env:
        DEPLOYER_URLS: ${{ inputs.deployer_urls }}
        DEPLOYER_TOKEN: ${{ inputs.deployer_token }}
      run: |
        export IMAGE="${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image_name }}:$IMAGE_TAG"
        bash "${{ github.action_path }}/notify/notify.sh"

branding:
  icon: 'package'
  color: 'blue'
