name: 'Genropy Docker Build and Push'
description: 'Build and push Docker images of a Genropy project'
author: 'genropy'

inputs:
  image_name:
    description: 'Name of the Docker image'
    required: true
  instance_name:
    description: 'Instance name for genropy'
    required: true
  registry:
    description: 'Container registry URL'
    required: false
    default: 'ghcr.io'
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  subfolder:
    description: "Repository subfolder for projects"
    required: false
    default: ''
  org_clone_token:
    description: 'Token for cloning private repositories'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for registry authentication'
    required: true
  deployer_urls:
    description: 'Comma-separated URLs to notify after build (GENROPY_DEPLOYER_URLS)'
    required: false
    default: ''
  deployer_token:
    description: 'Token for deployer authentication (GENROPY_DEPLOYER_TOKEN)'
    required: false
    default: ''
  image_tag:
    description: 'Override the computed image tag (takes precedence over branch-based tag logic)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install genropy
      shell: bash
      env:
        BUILD_SUBFOLDER: ${{ inputs.subfolder }}
      
      run: |
        pip install git+https://github.com/genropy/genropy.git@develop#subdirectory=gnrpy
        gnr app initgenropy --skip-existing
        gnr core bagedit /home/runner/.gnr/environment.xml add projects.build path=/home/runner/work/${{ github.event.repository.name }}$BUILD_SUBFOLDER

    - name: Log in to Container Registry
      shell: bash
      run: |
        echo "${{ inputs.github_token }}" | docker login ${{ inputs.registry }} \
        -u "${{ github.actor }}" --password-stdin

    - name: Compute image tag
      shell: bash
      run: |
        if [[ -n "${{ inputs.image_tag }}" ]]; then
          TAG="${{ inputs.image_tag }}"
        else
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" || "$BRANCH" == "develop" ]]; then
            TAG="latest"
          else
            TAG="${BRANCH//\//-}"
          fi
        fi
        echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

    - name: Configure git auth header and run builder
      shell: bash
      env:
        ORG_CLONE_TOKEN: ${{ inputs.org_clone_token }}
      run: |
        set -euo pipefail
        export GNR_LOGLEVEL=debug
        export GIT_TERMINAL_PROMPT=0
        export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig_with_pat"

        cat > "$GIT_CONFIG_GLOBAL" <<'EOF'
        [url "https://github.com/"]
          insteadOf = git@github.com:
          insteadOf = ssh://git@github.com/
        EOF
        if [ -n "${ORG_CLONE_TOKEN:-}" ]; then
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global http.https://github.com/.extraheader \
          "AUTHORIZATION: basic $(printf "x-access-token:%s" "$ORG_CLONE_TOKEN" | base64 -w0)"
        fi
        gnr app dockerize --bleeding -p -n ${{ inputs.image_name }} -u ${{ github.repository_owner}} -t $IMAGE_TAG ${{ inputs.instance_name }}

    - name: Notify Genropy deployers
      shell: bash
      env:
        DEPLOYER_URLS: ${{ inputs.deployer_urls }}
        DEPLOYER_TOKEN: ${{ inputs.deployer_token }}
      run: |
        if [ -z "${DEPLOYER_URLS:-}" ]; then
          echo "GENROPY_DEPLOYER_URLS not set, skipping deployer notification"
          exit 0
        fi
        IMAGE="ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:$IMAGE_TAG"
        IFS=',' read -ra URLS <<< "$DEPLOYER_URLS"
        for URL in "${URLS[@]}"; do
          URL="$(echo "$URL" | xargs)"
          echo "Notifying deployer at $URL with image $IMAGE"
          curl -fsSL -X POST "$URL" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg token "$DEPLOYER_TOKEN" --arg image "$IMAGE" '{token: $token, image: $image}')"
        done

branding:
  icon: 'package'
  color: 'blue'
