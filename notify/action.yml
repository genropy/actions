name: 'Notify Genropy Deployers'
description: 'Notify Genropy deployers that a new Docker image is available'
author: 'genropy'

inputs:
  image:
    description: 'Full image reference to deploy (e.g. hub.genro.com/owner/name:tag)'
    required: true
  deployer_urls:
    description: 'Comma-separated URLs to notify (GENROPY_DEPLOYER_URLS). If empty, notification is skipped.'
    required: false
    default: ''
  deployer_token:
    description: 'Token for deployer authentication (GENROPY_DEPLOYER_TOKEN)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Notify Genropy deployers
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DEPLOYER_URLS: ${{ inputs.deployer_urls }}
        DEPLOYER_TOKEN: ${{ inputs.deployer_token }}
      run: bash "${{ github.action_path }}/notify.sh"

branding:
  icon: 'send'
  color: 'blue'
